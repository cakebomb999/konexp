[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konexp"
version = "0.2.0"
description = "Konfiguration für die ROCCAT Kone XP unter Linux und Windows (DPI, Sensor, Beleuchtung, Tasten)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Linux spricht hidraw direkt an; Windows braucht hidapi (wie Swarm)
dependencies = ["hidapi>=0.14; sys_platform == 'win32'"]
authors = [{ name = "Marco" }]
keywords = ["roccat", "kone-xp", "mouse", "hidraw", "hidapi", "linux", "windows"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Environment :: X11 Applications :: Qt",
]

[project.optional-dependencies]
gui = [
    # PySide6 6.12.0 senkt auf Python < 3.12 den Refcount von None → "deallocating None"-Abort
    "PySide6>=6.5,<6.12; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
]
test = ["pytest"]

[project.scripts]
konexp = "konexp.cli:main"

[project.gui-scripts]
konexp-gui = "konexp.gui.__main__:main"

[tool.setuptools.packages.find]
include = ["konexp*"]

[tool.setuptools.package-data]
konexp = ["locale/*.po", "udev/*.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
