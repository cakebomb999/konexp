[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konexp"
version = "0.1.0"
description = "Linux-Konfiguration für die ROCCAT Kone XP (DPI, Sensor, Beleuchtung, Tasten)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Marco" }]
keywords = ["roccat", "kone-xp", "mouse", "hidraw", "linux"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Environment :: X11 Applications :: Qt",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest"]

[project.scripts]
konexp = "konexp.cli:main"

[project.gui-scripts]
konexp-gui = "konexp.gui.__main__:main"

[tool.setuptools.packages.find]
include = ["konexp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
